<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boletim de Inventário</title>
    <link rel="stylesheet" href="./css/estilo.css">
</head>

<body>
    <header>
        <div id="logo">LeeCoffe</div>

        <nav>
            <div>
                Home
            </div>
            <div>
                Menu
            </div>
            <div>
                Contatos
            </div>
            <div>
                Mais
            </div>
        </nav>
    </header>


    <main>
        <div>
            <div id="buttonTitle"> Boletim de inventário e nível de suprimento.</div>
            <button>
                Gerar Arquivo
            </button>
            
            <button id="btnVer">
                Ver Boletim
            </button>
        </div>

        <div id="visualizador" hidden>
            <iframe src="python/boletim.pdf" title="Boletim de estoque"></iframe>
        </div>
    </main>

    <script>
        const btn = document.getElementById("btnVer");
        const area = document.getElementById("visualizador");

        btn.addEventListener("click", () => {
            area.hidden = !area.hidden;
            btn.textContent = area.hidden ? "Ver Boletim" : "Ocultar Boletim";
        });
    </script>
</body>

</html>
